# Runner egress is fail-closed. The executor has no route to the public network;
# every HTTP(S) request must cross this proxy and match one of these destinations.
http_port 3128

acl CONNECT method CONNECT
acl SSL_ports port 443
acl Safe_ports port 80 443

# Subscription providers exercised by the supported runtimes. Keep this list
# narrow and update it only together with a real runner conformance probe.
acl provider_domains dstdomain \
  .anthropic.com \
  .claude.ai \
  .openai.com \
  .chatgpt.com \
  .oaiusercontent.com \
  .opencode.ai \
  .openrouter.ai \
  .kimi.com \
  .moonshot.ai \
  .moonshot.cn

# Package downloads used by the staged website workspace.
acl package_domains dstdomain \
  .npmjs.org \
  .yarnpkg.com

# Never let an allowlisted hostname become a tunnel to Compose, the host, or a
# link-local/cloud metadata address after DNS resolution.
acl private_destination dst \
  0.0.0.0/8 \
  10.0.0.0/8 \
  100.64.0.0/10 \
  127.0.0.0/8 \
  169.254.0.0/16 \
  172.16.0.0/12 \
  192.0.0.0/24 \
  192.168.0.0/16 \
  198.18.0.0/15 \
  224.0.0.0/4 \
  240.0.0.0/4 \
  ::/128 \
  ::1/128 \
  fc00::/7 \
  fe80::/10

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access deny private_destination
http_access allow provider_domains
http_access allow package_domains
http_access deny all

# Do not disclose the executor address upstream or persist URLs/query payloads.
forwarded_for delete
request_header_access X-Forwarded-For deny all
request_header_access Via deny all
reply_header_access Via deny all
via off

cache deny all
cache_mem 32 MB
maximum_object_size 0 KB
pinger_enable off

# Method + TLS SNI + status are sufficient for operations without recording
# paths, query strings, prompts, package names, or credential-shaped values.
logformat runner_redacted %ts.%03tu %>a %rm %{Host}>h %Ss/%>Hs
access_log stdio:/dev/stdout runner_redacted
cache_log /var/log/squid/cache.log
pid_filename /tmp/squid.pid
coredump_dir /tmp
