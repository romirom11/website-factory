# Full factory stack. Portable: runs on any Linux box with Docker.
# App processes (workers/api/telegram) can run via `docker compose up` in prod
# or via `pnpm all` locally against these services.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: factory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-factory}
      POSTGRES_DB: factory
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factory"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-factory}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-factorysecret}
    volumes:
      - miniodata:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Google Maps discovery (spec §3). The ONLY discovery source: the factory's
  # discovery worker is a thin client of this service's REST API.
  # `-web` starts the web UI + REST API (POST/GET /api/v1/jobs, GET
  # /api/v1/jobs/{id}, GET /api/v1/jobs/{id}/download -> CSV) on -addr.
  # Inside the compose network it is reachable as http://gosom:8080.
  # The host mapping exists only because in dev the factory runs via `pnpm` on
  # the host (not in the compose network); it is bound to 127.0.0.1 and uses
  # 8085 because 8080 is commonly occupied. In production, where the factory
  # container talks to it over the compose network, this `ports:` block can be
  # deleted and only `expose:` kept.
  gosom:
    # Pin an exact tag: v1.14.0 is unusable — it downloads the Playwright driver
    # at runtime from playwright.azureedge.net, which now 404s, so every job
    # hangs in `working` forever. v1.17.3 ships a working driver.
    image: gosom/google-maps-scraper:v1.17.3
    restart: unless-stopped
    command: ["-web", "-addr", ":8080", "-data-folder", "/gmapsdata"]
    volumes:
      - gosomdata:/gmapsdata
    expose:
      - "8080"
    ports:
      - "127.0.0.1:8085:8080"   # dev only: factory runs on the host via pnpm
    healthcheck:
      test: ["CMD-SHELL", "timeout 4 bash -c 'echo >/dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Factory core: discovery/normalize/qualify/assets/audit/readiness, enrichment,
  # deploy + approval + outreach, plus the internal API and the demo static server.
  #
  # Split from factory-build on purpose (SPEC §2.3(а)): job ownership and
  # heartbeats remain independent. Agent capacity is preserved as group context
  # across the remote runner boundary. `pnpm all` still runs every group locally.
  factory:
    image: websites-factory/factory:local
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      gosom:
        condition: service_healthy
      agent-runner-gateway:
        condition: service_healthy
    # `.env` carries INFRA only (DATABASE_URL, S3_*, UI_*, SETTINGS_MASTER_KEY,
    # ports). Operational settings live in Postgres and are edited at /settings
    # in the UI — env values below stay as a FALLBACK for a fresh box, and are
    # deliberately limited to compose topology so they cannot shadow a value
    # Roman saved in the UI (resolution order is DB -> env -> default).
    env_file: .env
    environment:
      DATABASE_URL: postgres://factory:${POSTGRES_PASSWORD:-factory}@postgres:5432/factory
      S3_ENDPOINT: http://minio:9000
      GOSOM_URL: http://gosom:8080
      WORKER_GROUPS: core,enrich
      # WAHA auth: the SAME interpolation the `waha` service uses, so the
      # factory's env fallback (DB -> env -> default) matches the WAHA container
      # BY CONSTRUCTION — with or without a real key set in the deploy env.
      # A DB override in /settings still wins; only set one to use a key the
      # container was NOT started with (i.e. never).
      WAHA_API_KEY: ${WAHA_API_KEY:-factory-dev-key}
      WAHA_HOOK_HMAC_KEY: ${WAHA_HOOK_HMAC_KEY:-}
      WAHA_SESSION: ${WAHA_SESSION:-default}
      # The demo server defaults to binding 127.0.0.1, which is the right default
      # for a bare-metal run but means "container loopback" here — Docker's port
      # forwarding cannot reach it and every demo URL dies with a refused
      # connection. The isolation that default protects is provided instead by
      # the `ports:` mapping below, which publishes only to the host's 127.0.0.1.
      DEMO_HOST: 0.0.0.0
      # Where the «Відкрити термінал збірки» button points. The terminal itself
      # is served by `agent-runner-executor`; this process only reports the URL, so it
      # must be an address ROMAN'S BROWSER can reach, not a compose-internal one.
      # Empty is a valid answer: the console then explains the SSH attach instead
      # of offering a link that would not resolve. NO fallback here on purpose:
      # the old `:-http://localhost:7681` default meant an EMPTY setting still
      # rendered the button — pointing every server visitor at their own
      # localhost — while the settings hint promised «порожньо = кнопки немає».
      BUILD_TERMINAL_BASE_URL: ${BUILD_TERMINAL_BASE_URL:-}
      AGENT_EXECUTION_MODE: remote
      RUNNER_GATEWAY_URL: http://agent-runner-gateway:8790
      RUNNER_API_KEY: ${RUNNER_API_KEY:?RUNNER_API_KEY must be set for remote agent execution}
      RUNNER_SITES_ROOT: /app/sites
      RUNNER_INPUTS_ROOT: /app/agent-inputs
      RUNNER_SEED_CLAUDE_CREDENTIAL: ${RUNNER_SEED_CLAUDE_CREDENTIAL:-false}
    volumes:
      # Named volumes, NOT host bind mounts: a bind dir is created by the docker
      # daemon as root:root and the container runs as `node` (uid 1000), which
      # yields EACCES on the first mkdir. A named volume inherits the image's
      # ownership of /app/sites (chowned to node in the Dockerfile) on first use.
      # To inspect contents from the host: docker compose cp factory:/app/sites ./
      - sitesdata:/app/sites
      - deploysdata:/app/deploys
      # Small image/brief workspaces staged for the remote runner gateway.
      - agentinputs:/app/agent-inputs
    ports:
      - "127.0.0.1:8787:8787"   # internal API / webhooks
      - "127.0.0.1:8788:8788"   # demo static server

  # Site production orchestration only: content-and-design, build-site, visual-qa.
  # Agent processes themselves run in the isolated runner executor, which
  # restores this worker group's separately configured capacity.
  # Shares the sites/ and deploys/ volumes with `factory`, which serves the demos.
  factory-build:
    image: websites-factory/factory:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      agent-runner-gateway:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://factory:${POSTGRES_PASSWORD:-factory}@postgres:5432/factory
      S3_ENDPOINT: http://minio:9000
      WORKER_GROUPS: build
      # pnpm content-addressable store on the persistent sites volume: workspace
      # installs become hardlink-only after the first build instead of pulling
      # the registry on every container recreate (MOTION-PLAN phase 6). The
      # NPM_CONFIG_ prefix passes the agent-env allowlist (sandbox.ts).
      NPM_CONFIG_STORE_DIR: /app/sites/.pnpm-store
      AGENT_EXECUTION_MODE: remote
      RUNNER_GATEWAY_URL: http://agent-runner-gateway:8790
      RUNNER_API_KEY: ${RUNNER_API_KEY:?RUNNER_API_KEY must be set for remote agent execution}
      RUNNER_SITES_ROOT: /app/sites
      RUNNER_INPUTS_ROOT: /app/agent-inputs
      RUNNER_SEED_CLAUDE_CREDENTIAL: ${RUNNER_SEED_CLAUDE_CREDENTIAL:-false}
    volumes:
      # Named volumes, NOT host bind mounts: a bind dir is created by the docker
      # daemon as root:root and the container runs as `node` (uid 1000), which
      # yields EACCES on the first mkdir. A named volume inherits the image's
      # ownership of /app/sites (chowned to node in the Dockerfile) on first use.
      # To inspect contents from the host: docker compose cp factory:/app/sites ./
      - sitesdata:/app/sites
      - deploysdata:/app/deploys
      - agentinputs:/app/agent-inputs
    # Workers only: the API and demo server belong to `factory` (one port owner).
    # `db:migrate` is idempotent and also runs in `factory`'s CMD; whichever
    # container starts first applies the schema, the other is a no-op.
    command: ["sh", "-c", "pnpm db:migrate && pnpm workers"]

  # Trusted staging gateway. It can see factory workspaces, but has no provider
  # auth volumes and never starts a model/tool process itself.
  agent-runner-gateway:
    image: websites-factory/agent-runner-gateway:local
    build:
      context: .
      dockerfile: Dockerfile.runner
      target: gateway
    restart: unless-stopped
    depends_on:
      agent-runner-executor:
        condition: service_healthy
    environment:
      RUNNER_GATEWAY_PORT: 8790
      RUNNER_API_KEY: ${RUNNER_API_KEY:?RUNNER_API_KEY must be set for remote agent execution}
      EXECUTOR_API_KEY: ${RUNNER_EXECUTOR_API_KEY:?RUNNER_EXECUTOR_API_KEY must be set for the private executor hop}
      RUNNER_EXECUTOR_URL: http://agent-runner-executor:8791
      RUNNER_SITES_ROOT: /app/sites
      RUNNER_INPUTS_ROOT: /app/agent-inputs
      RUNNER_WORK_ROOT: /app/runner-work
      RUNNER_WORK_RETENTION_HOURS: ${RUNNER_WORK_RETENTION_HOURS:-168}
    volumes:
      - sitesdata:/app/sites
      - agentinputs:/app/agent-inputs
      - runnerwork:/app/runner-work
    networks:
      - default
      - runner-control
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8790/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Provider/runtime executor. It sees only per-invocation scratch and provider
  # auth volumes — never sitesdata, Postgres, MinIO or factory settings.
  agent-runner-executor:
    image: websites-factory/agent-runner-executor:local
    build:
      context: .
      dockerfile: Dockerfile.runner
      target: executor
    restart: unless-stopped
    depends_on:
      agent-egress-proxy:
        condition: service_healthy
      agent-egress-dns:
        condition: service_healthy
        restart: true
    environment:
      RUNNER_EXECUTOR_PORT: 8791
      EXECUTOR_API_KEY: ${RUNNER_EXECUTOR_API_KEY:?RUNNER_EXECUTOR_API_KEY must be set for the private executor hop}
      RUNNER_WORK_ROOT: /app/runner-work
      RUNNER_CREDENTIAL_ROOT: /app/runner-work/.private/credentials
      CODEX_HOME: /app/runner-work/.private/codex
      XDG_DATA_HOME: /app/runner-work/.private/provider
      # Used only to derive ttyd basic auth inside the executor. Gateway has the
      # same private hop key and returns the derived password to authenticated UI.
      INTERNAL_API_KEY: ${RUNNER_EXECUTOR_API_KEY:?RUNNER_EXECUTOR_API_KEY must be set for the private executor hop}
      BUILD_TERMINAL_PORT: ${BUILD_TERMINAL_PORT:-7681}
      BUILD_TERMINAL_WEB: ${BUILD_TERMINAL_WEB:-true}
      BUILD_TERMINAL_WRITABLE: ${BUILD_TERMINAL_WRITABLE:-false}
      # The shared work volume is initialized as uid 1000 by the image. Keeping
      # the pnpm store below it avoids a separately mounted root-owned cache
      # while still preserving downloads across executor restarts.
      NPM_CONFIG_STORE_DIR: /app/runner-work/.pnpm-store
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
      NPM_CONFIG_PROXY: http://agent-egress-proxy:3128
      NPM_CONFIG_HTTPS_PROXY: http://agent-egress-proxy:3128
      HTTP_PROXY: http://agent-egress-proxy:3128
      HTTPS_PROXY: http://agent-egress-proxy:3128
      http_proxy: http://agent-egress-proxy:3128
      https_proxy: http://agent-egress-proxy:3128
      NO_PROXY: 127.0.0.1,localhost,agent-runner-executor,agent-runner-gateway
      no_proxy: 127.0.0.1,localhost,agent-runner-executor,agent-runner-gateway
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
      DISABLE_TELEMETRY: "1"
      DO_NOT_TRACK: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      RUNNER_REQUIRE_ISOLATION: "true"
      RUNNER_DNS_PROTECTION_ENABLED: ${RUNNER_DNS_PROTECTION_ENABLED:-true}
      # Claude's first-run/trust state must be writable but ephemeral. Provider
      # credentials live only in their dedicated named volumes below.
      HOME: /home/node/runtime-home
      XDG_CACHE_HOME: /home/node/.cache
    volumes:
      - runnerwork:/app/runner-work
      # Nested named-volume overlays keep credentials out of runnerwork as seen
      # by the gateway, while their writable parent lets bubblewrap establish
      # deny mounts under a read-only container root.
      - runnerclaude:/app/runner-work/.private/credentials
      - codexhome:/app/runner-work/.private/codex
      - opencodehome:/app/runner-work/.private/provider/opencode
    networks:
      - runner-control
      - runner-egress-v2
    dns:
      # Docker's embedded resolver answers private service names itself and
      # forwards public lookups to the executor's unprivileged loopback relay.
      - 127.0.0.53
    # Port 53 is privileged by default on a plain Linux network namespace.
    # Declare the executor's namespaced requirement explicitly so the non-root
    # relay behaves the same on Docker Engine and Docker Desktop.
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777
      - /home/node/.cache:size=512m,uid=1000,gid=1000,mode=700
      - /home/node/runtime-home:size=512m,uid=1000,gid=1000,mode=700
      - /home/node/.local/state:size=256m,uid=1000,gid=1000,mode=700
    cap_drop: ["ALL"]
    # Nested bubblewrap needs clone/unshare syscalls. No capabilities are added;
    # the tool sandbox itself applies filesystem/network/seccomp restrictions.
    security_opt:
      - no-new-privileges:true
      - seccomp=unconfined
    pids_limit: 512
    mem_limit: ${RUNNER_MEMORY_LIMIT:-6g}
    init: true
    ports:
      - "127.0.0.1:${BUILD_TERMINAL_PORT:-7681}:${BUILD_TERMINAL_PORT:-7681}"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8791/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20

  # The executor has no public route. Squid is its only HTTP(S) bridge and
  # rejects direct IPs, private addresses, arbitrary CONNECT and non-allowlisted
  # destinations before resolving them on the ordinary Compose network.
  agent-egress-proxy:
    image: websites-factory/agent-egress-proxy:local
    build:
      context: .
      dockerfile: Dockerfile.runner
      target: egress-proxy
    restart: unless-stopped
    networks:
      - runner-egress-v2
      - default
    read_only: true
    tmpfs:
      - /tmp:size=32m,uid=13,gid=13,mode=700
      - /var/log/squid:size=32m,uid=13,gid=13,mode=700
      - /var/spool/squid:size=64m,uid=13,gid=13,mode=700
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/busybox", "nc", "-z", "-w", "2", "127.0.0.1", "3128"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Filtering resolver: approved provider/package zones are forwarded; every
  # other external query is answered REFUSED and never leaves the machine.
  agent-egress-dns:
    image: websites-factory/agent-egress-dns:local
    build:
      context: .
      dockerfile: Dockerfile.runner
      target: egress-dns
    command: ["-conf", "/Corefile.${RUNNER_DNS_PROTECTION_ENABLED:-true}"]
    restart: unless-stopped
    networks:
      runner-egress-v2: {}
      default: {}
    read_only: true
    cap_drop: ["ALL"]
    # CoreDNS runs non-root but its binary carries CAP_NET_BIND_SERVICE so it
    # can bind the standard resolver port. Keeping only that capability avoids
    # Docker rejecting exec after the bounding set is otherwise emptied.
    cap_add: ["NET_BIND_SERVICE"]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/busybox", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8181/ready"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Control UI (spec §2.2, decision #9): approval queue, funnel, campaigns,
  # jobs, conversations. This is THE interface — Telegram only links into it.
  # Built from the repo root so the Dockerfile can copy `src/db/schema.ts`
  # (the UI shares the factory's drizzle schema, never a duplicate).
  # Bound to 127.0.0.1: put it behind a TLS reverse proxy or a tunnel in prod;
  # UI_BASE_URL must then be the public URL, since Telegram links use it.
  ui:
    build:
      context: .
      dockerfile: ui/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    env_file: .env
    environment:
      DATABASE_URL: postgres://factory:${POSTGRES_PASSWORD:-factory}@postgres:5432/factory
      S3_ENDPOINT: http://minio:9000
      UI_PASSWORD: ${UI_PASSWORD:?UI_PASSWORD must be set — the control UI refuses to run without auth}
      UI_SESSION_SECRET: ${UI_SESSION_SECRET:-}
      UI_BASE_URL: ${UI_BASE_URL:-http://localhost:3000}
      # Dates are rendered on the server. Without a TZ the container formats UTC
      # while Roman's browser shows local time — every timestamp in the console
      # would be off by the offset. Defaults to Greece, where the campaigns are.
      TZ: ${TZ:-Europe/Athens}
      # The approval preview iframes the demo server. Inside compose the browser
      # is Roman's, not a container, so this must be a host-reachable URL.
      DEMO_BASE_URL: ${DEMO_BASE_URL:-http://localhost:8788}
      # Decrypts the secrets stored in the `settings` table so /settings can
      # show a masked tail and write new ones. Same key as the factory's.
      SETTINGS_MASTER_KEY: ${SETTINGS_MASTER_KEY:-}
      # The UI asks the factory API to route connectivity checks to the process
      # that owns each dependency (agent checks continue to the runner).
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
      FACTORY_API_URL: ${FACTORY_API_URL:-http://factory:8787}
      RUNNER_GATEWAY_URL: http://agent-runner-gateway:8790
      # Read-only fallbacks for the status panel and the WAHA QR proxy; the
      # effective values still come from the settings table first.
      GOSOM_URL: http://gosom:8080
      WAHA_URL: ${WAHA_URL:-http://waha:3000}
    ports:
      - "127.0.0.1:3000:3000"

  # WhatsApp channel (spec §2.2, decision #2): WAHA = self-hosted WhatsApp HTTP
  # API, NOT the Meta Cloud API. Roman scans a QR once with the DEDICATED
  # outreach number (never his personal one — the protocol is unofficial and the
  # number can be banned), WAHA keeps the session in the mounted volume, and
  # POSTs inbound messages to the factory's /webhooks/waha.
  #
  # Image note: `devlikeapro/waha:latest` bundles Chromium and is amd64-only.
  # On Apple Silicon use WAHA_IMAGE=devlikeapro/waha:noweb-arm (the NOWEB engine
  # needs no browser). Since 2026.6.1 there is no Core/Plus split: sendText,
  # check-exists, sessions and the `message` webhook are all in the free image.
  #
  # Bound to 127.0.0.1 like everything else: the WhatsApp session is a
  # credential, and an exposed WAHA is an account takeover.
  waha:
    image: ${WAHA_IMAGE:-devlikeapro/waha:noweb}
    restart: unless-stopped
    volumes:
      - wahasessions:/app/.sessions
    environment:
      # Auth: every /api/* call must carry X-Api-Key. /ping and /health are excluded
      # so healthchecks work without the key.
      #
      # Every variable carries a dev default. Compose interpolates EVERY
      # service's variables on EVERY command, so a `${VAR:?}` requirement here
      # would break unrelated commands (`docker compose exec postgres …`,
      # `docker compose ps`) for anyone who has not configured WhatsApp yet.
      # The defaults are deliberately obvious placeholders, and the startup
      # check below refuses to run with them on a non-loopback binding.
      WAHA_API_KEY: ${WAHA_API_KEY:-factory-dev-key}
      WHATSAPP_API_KEY_EXCLUDE_PATH: ping,health
      # Inbound -> factory. `factory` resolves inside the compose network.
      WHATSAPP_HOOK_URL: ${WAHA_HOOK_URL:-http://factory:8787/webhooks/waha}
      WHATSAPP_HOOK_EVENTS: message
      WHATSAPP_HOOK_HMAC_KEY: ${WAHA_HOOK_HMAC_KEY:-}
      # WAHA echoes this header back to us, so the factory can authenticate the
      # webhook itself and not just trust the network.
      WHATSAPP_HOOK_CUSTOM_HEADERS: X-Api-Key:${WAHA_API_KEY:-factory-dev-key}
      # Bring the paired session back up after a restart instead of waiting for
      # a manual start (the factory must survive reboots unattended).
      WHATSAPP_START_SESSION: ${WAHA_SESSION:-default}
      WHATSAPP_RESTART_ALL_SESSIONS: "True"
      WHATSAPP_DEFAULT_ENGINE: ${WAHA_ENGINE:-NOWEB}
      WAHA_LOCAL_STORE_BASE_DIR: /app/.sessions
      # Dashboard is where Roman scans the QR. Password required.
      WAHA_DASHBOARD_ENABLED: "true"
      WAHA_DASHBOARD_USERNAME: ${WAHA_DASHBOARD_USERNAME:-waha}
      WAHA_DASHBOARD_PASSWORD: ${WAHA_DASHBOARD_PASSWORD:-factory-dev-password}
      # Opt-in escape hatch for local dev only (see the startup check below).
      WAHA_ALLOW_DEV_KEY: ${WAHA_ALLOW_DEV_KEY:-false}
    # The dev defaults above keep every other compose command working, but they
    # must never protect a real WhatsApp session: an open WAHA is an account
    # takeover and the dashboard is the QR pairing page. So the placeholders are
    # allowed ONLY while the service stays on loopback (WAHA_ALLOW_DEV_KEY=true,
    # which the dev workflow sets). Anywhere else, real secrets are required.
    #
    # `command:` rather than `entrypoint:` so the image's tini stays PID 1
    # (correct signal handling); the image's own CMD is /entrypoint.sh, which
    # this wraps and then execs.
    command:
      - /bin/sh
      - -c
      - |
        placeholder=0
        [ "$$WAHA_API_KEY" = "factory-dev-key" ] && placeholder=1
        [ "$$WAHA_DASHBOARD_PASSWORD" = "factory-dev-password" ] && placeholder=1
        if [ -z "$$WAHA_API_KEY" ] || [ -z "$$WAHA_DASHBOARD_PASSWORD" ] || \
           { [ "$$placeholder" = "1" ] && [ "$$WAHA_ALLOW_DEV_KEY" != "true" ]; }; then
          echo "REFUSING TO START: WAHA is using placeholder credentials." >&2
          echo "An unprotected WAHA means anyone who reaches it owns the WhatsApp account." >&2
          echo "Set real secrets in .env:" >&2
          echo "  echo \"WAHA_API_KEY=\$$(openssl rand -hex 32)\" >> .env" >&2
          echo "  echo \"WAHA_DASHBOARD_PASSWORD=\$$(openssl rand -hex 16)\" >> .env" >&2
          echo "(local dev on 127.0.0.1 only: set WAHA_ALLOW_DEV_KEY=true)" >&2
          exit 1
        fi
        exec /entrypoint.sh
    expose:
      - "3000"
    ports:
      - "127.0.0.1:3001:3000"   # QR scan + dev: factory runs on the host via pnpm

  # ── DEV ONLY (profile `dev-mail`) ──────────────────────────────────────────
  # Local SMTP+IMAP so the whole outreach cycle (send -> land -> reply -> poll)
  # can be verified WITHOUT Roman's Gmail app password and without a single
  # message leaving the machine. Accepts any user/password on any address.
  # Never started by a plain `docker compose up` — it needs `--profile dev-mail`.
  #   SMTP 3025, IMAP 3143, HTTP API 8080 (used to inject a reply in tests).
  greenmail:
    image: greenmail/standalone@sha256:9f32971b4f25d32b4de6fa2e297423768441c65e4541f6aecd7631c890a229a7
    profiles: ["dev-mail"]
    restart: "no"
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.smtp
        -Dgreenmail.setup.test.imap
